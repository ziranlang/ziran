name: Publish website

on:
  push:
    branches: [master]
    paths:
      - examples/**
      - site/**
      - web/playground.c
      - web/bundle.c
      - scripts/build_playground.zi
      - scripts/site_target*
      - scripts/site_library_targets.py
      - scripts/site_kernel_targets.py
      - scripts/site_standard_benchmarks.zi
      - scripts/site_benchmark_*.zi
      - bench/standard_cases.zi
      - bench/json_text.py
      - scripts/site_numbers.zi
      - bench/results/standard/**
      - scripts/benchmark_samples.py
      - bench/results/wasm-tier-*.json
      - tests/site_targets.sh
      - bootstrap/runtime/**
      - cmd/package*.zi
      - cmd/compiler_*.zi
      - bootstrap/**
      - std/**
      - Makefile
      - .gitea/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: build-primary
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Receipt checks read inputs at the commits that measured and published them.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '6.0.6'
      - name: Build the browser playground
        run: |
          rm -rf site/examples
          mkdir site/examples
          cp examples/*.zi site/examples/
          make -j2 all
          emcc_path=$(command -v emcc)
          build/bin/ziran run --target=c scripts/build_playground.zi -- --emcc "$emcc_path"
          node tests/playground_runtime.cjs
          node tests/web_bundle_runtime.cjs
      - name: Verify target matrix and site links
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY sh tests/site_targets.sh build/bin/ziran
          python3 scripts/site_links.py
      - name: Upload the verified site
        uses: actions/upload-artifact@v4
        with:
          name: ziran-website
          path: site/
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: build-native
    timeout-minutes: 15
    steps:
      - name: Download the verified site
        uses: actions/download-artifact@v4
        with:
          name: ziran-website
          path: site/
      - name: Prepare Wrangler
        run: npm exec --yes --package=wrangler@4.152.0 -- wrangler --version
      - name: Deploy Ziran to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          test -s site/index.html
          : "${CLOUDFLARE_API_TOKEN:?Missing Pages deployment token}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing Cloudflare account}"
          npm exec --offline --yes --package=wrangler@4.152.0 -- wrangler pages deploy site \
            --project-name=ziran --branch=master --commit-hash="$GITHUB_SHA"
      - name: Verify the production asset
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 20 "https://ziran-lang.org/assets/playground-runtime.js?revision=$GITHUB_SHA" | cmp -s - site/assets/playground-runtime.js; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 5; fi
          done
          echo 'Production Ziran asset differs from the deployed site' >&2
          exit 1
