name: Compile cache
description: >-
  Reuses C objects through ccache and Go's build cache between runs. The job
  installs ccache first.
inputs:
  key:
    description: Separates plain and sanitized builds, which share no objects.
    required: true
runs:
  using: composite
  steps:
    - name: Name today's compiler cache
      id: day
      shell: bash
      run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
    # One entry a day keeps the repository's 10 GB cache allowance safe.
    - name: Restore C and Go objects
      uses: actions/cache@v4
      with:
        path: |
          ~/.ccache
          ~/.cache/go-build
        key: compile-${{ runner.os }}-${{ inputs.key }}-${{ steps.day.outputs.day }}
        restore-keys: compile-${{ runner.os }}-${{ inputs.key }}-
    - name: Compile through the cache
      shell: bash
      run: |
        echo /usr/lib/ccache >> "$GITHUB_PATH"
        {
          echo "CCACHE_DIR=$HOME/.ccache"
          echo "CCACHE_MAXSIZE=200M"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          echo "CCACHE_NOHASHDIR=true"
        } >> "$GITHUB_ENV"
