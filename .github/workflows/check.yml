name: Check
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install ripgrep, MinGW, and Wine for the test scripts
        timeout-minutes: 5
        run: sh scripts/ci_packages.sh ripgrep gcc-mingw-w64-x86-64 wine wine64
      - name: Build the toolchain
        run: make
      - name: Run the language, backend, and portable runtime checks
        run: env -u DISPLAY -u WAYLAND_DISPLAY make check CHECK_JOBS=4
      - name: Keep complete check logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: build/check-logs/
  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install ripgrep for the test scripts
        timeout-minutes: 5
        run: sh scripts/ci_packages.sh ripgrep
      - name: Run the checks under AddressSanitizer and UBSan
        run: env -u DISPLAY -u WAYLAND_DISPLAY make sanitize CHECK_JOBS=4
      - name: Keep complete sanitizer check logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-check-logs
          path: build/sanitize/check-logs/
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fuzz the frontend
        run: env -u DISPLAY -u WAYLAND_DISPLAY make fuzz FUZZ_SECONDS=180
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/sanitize/fuzz/crash-*
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: oqs
            libraries: -loqs
          - package: sqlite
            libraries: -lsqlite3 -lm -ldl -pthread
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ziranlang/${{ matrix.package }}
          path: package
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build the current toolchain
        run: make
      - name: Build the package's locked native library
        run: env -u DISPLAY -u WAYLAND_DISPLAY make -C package native ZIRAN="$GITHUB_WORKSPACE/build/bin/ziran"
      - name: Test every backend from source and saved IR with the current compiler
        working-directory: package
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/test_native_package.py" \
            --ziran "$GITHUB_WORKSPACE/build/bin/ziran" \
            --tools "$GITHUB_WORKSPACE/build/bin" \
            --source "tests/${{ matrix.package }}_test.zi" \
            --entry "${{ matrix.package }}_test:main" \
            --library-dir build/native \
            --libraries="${{ matrix.libraries }}"
