name: Check
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install ripgrep, MinGW, and Wine for the test scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep gcc-mingw-w64-x86-64 wine wine64
      - name: Build the toolchain
        run: make
      - name: Run the language, backend, and portable runtime checks
        run: env -u DISPLAY -u WAYLAND_DISPLAY make check CHECK_JOBS=4
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install ripgrep for the test scripts
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run the checks under AddressSanitizer and UBSan
        run: env -u DISPLAY -u WAYLAND_DISPLAY make sanitize CHECK_JOBS=4
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fuzz the frontend
        run: env -u DISPLAY -u WAYLAND_DISPLAY make fuzz FUZZ_SECONDS=180
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/sanitize/fuzz/crash-*
