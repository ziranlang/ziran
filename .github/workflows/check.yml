name: Check
on:
  # Prose alone cannot break a check. CHANGELOG.md is read by the version check.
  push:
    branches: [master]
    paths: ['**', '!**/*.md', CHANGELOG.md]
  pull_request:
    paths: ['**', '!**/*.md', CHANGELOG.md]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        # site_pages.sh marks std modules shipped in the latest v* tag.
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install ripgrep, MinGW, Vorbis, ARMv7 and Wasm tools, and the private display for the test scripts
        timeout-minutes: 5
        run: sh scripts/ci_packages.sh ccache ripgrep zip unzip gcc-mingw-w64-x86-64 xvfb xauth ffmpeg libvorbis-dev python3-markdown gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user clang-18 lld-18
      - name: Keep compile results between runs
        uses: ./.github/actions/compile-cache
        with:
          key: check
      - name: Build the toolchain
        run: make
      - name: Run the language, backend, and portable runtime checks
        run: env -u DISPLAY -u WAYLAND_DISPLAY WINDOWS_REQUIRED=1 ARM_REQUIRED=1 WASM_REQUIRED=1 ZIRAN_WASM_CC=clang-18 make check CHECK_JOBS=4
      - name: Show how much the compile cache saved
        if: always()
        run: ccache --show-stats || true
      - name: Keep complete check logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: build/check-logs/
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the toolchain
        run: make
      - name: Run file, formatter and package commands natively
        run: |
          ziran="$GITHUB_WORKSPACE/build/bin/ziran"
          sh tests/std_file_darwin.sh "$ziran"
          sh tests/compile_commands.sh "$ziran"
          printf 'Answer::()->s32 {\nreturn 42\n}\n' > "$RUNNER_TEMP/app.zi"
          "$ziran" fmt "$RUNNER_TEMP/app.zi"
          "$ziran" fmt --check "$RUNNER_TEMP/app.zi"
          "$ziran" new "$RUNNER_TEMP/hello"
          printf '[overrides]\nziran = "%s"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/hello/ziran.local.toml"
          cd "$RUNNER_TEMP/hello"
          test "$("$ziran" run)" = "Hello, world!"
  sanitize:
    name: sanitize
    runs-on: ubuntu-24.04
    # Runner speed varies; execute the whole lean suite under both sanitizers.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        # site_pages.sh marks std modules shipped in the latest v* tag.
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install ripgrep and Vorbis for the test scripts
        timeout-minutes: 5
        run: sh scripts/ci_packages.sh ccache ripgrep zip unzip ffmpeg libvorbis-dev python3-markdown
      - name: Keep compile results between runs
        uses: ./.github/actions/compile-cache
        with:
          key: sanitize
      - name: Run the checks under AddressSanitizer and UBSan
        run: env -u DISPLAY -u WAYLAND_DISPLAY make sanitize CHECK_JOBS=4
      - name: Show how much the compile cache saved
        if: always()
        run: ccache --show-stats || true
      - name: Keep complete sanitizer check logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-check-logs
          path: build/sanitize/check-logs/
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fuzz the frontend
        run: env -u DISPLAY -u WAYLAND_DISPLAY make fuzz FUZZ_SECONDS=180
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/sanitize/fuzz/crash-*
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: oqs
            libraries: -loqs
          - package: sqlite
            libraries: -lsqlite3 -lm -ldl -pthread
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ziranlang/${{ matrix.package }}
          path: package
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build the current toolchain
        run: make
      - name: Build the package's locked native library
        run: env -u DISPLAY -u WAYLAND_DISPLAY make -C package native ZIRAN="$GITHUB_WORKSPACE/build/bin/ziran"
      - name: Test every backend from source and saved IR with the current compiler
        working-directory: package
        run: |
          sh "$GITHUB_WORKSPACE/scripts/test_native_package.sh" \
            --ziran "$GITHUB_WORKSPACE/build/bin/ziran" \
            --tools "$GITHUB_WORKSPACE/build/bin" \
            --source "tests/${{ matrix.package }}_test.zi" \
            --entry "${{ matrix.package }}_test:main" \
            --library-dir build/native \
            --libraries="${{ matrix.libraries }}"
