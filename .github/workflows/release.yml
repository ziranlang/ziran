name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag new version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the release for a new VERSION
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION=$(cat VERSION)
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, nothing to release"
            exit 0
          fi
          NOTES=$(awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found' CHANGELOG.md)
          test -n "$NOTES"
          git tag -a "$TAG" -m "Ziran $VERSION"
          git push origin "$TAG"
          gh release create "$TAG" --title "Ziran $VERSION" --notes "$NOTES"
