name: Publish website

# Publishes site/ to the Cloudflare Pages project "ziran" (ziran-lang.org)
# whenever a push to master changes it. The repository secrets
# CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID
# authorize it; without them the job finishes without deploying.
# Deploy only through this GitHub Actions workflow; never invoke Wrangler locally.

on:
  push:
    branches: [master]
    paths: ['site/**', 'web/playground.c', 'web/bundle.c', 'scripts/build_playground.zi', 'scripts/site_target*', 'scripts/site_library_targets.py', 'scripts/benchmark_samples.py', 'tests/site_targets.sh', 'cmd/zir/**', 'cmd/package*.zi', 'cmd/compiler_*.zi', 'bootstrap/**', 'std/**', 'Makefile', '.github/workflows/site.yml']
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set; skipping the deploy."
          fi
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.present == 'true'
      - name: Set up Emscripten
        if: steps.credentials.outputs.present == 'true'
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '6.0.6'
      - name: Build the browser playground
        if: steps.credentials.outputs.present == 'true'
        run: |
          make -j2 all
          build/bin/ziran run --target=c scripts/build_playground.zi
          node tests/playground_runtime.cjs
          node tests/web_bundle_runtime.cjs
      - name: Verify target matrix and site links
        if: steps.credentials.outputs.present == 'true'
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY sh tests/site_targets.sh build/bin/ziran
          python3 scripts/site_links.py
      - name: Deploy site/ to Cloudflare Pages
        if: steps.credentials.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=ziran --branch=master
